# Сборка статического сайта и публикация на GitHub Pages.
# В настройках репозитория: Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: Deploy to GitHub Pages

on:
  push:
    # Публикация идёт только с main: окружение github-pages не принимает другие ветки.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одна публикация за раз: новая сборка отменяет незавершённую.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # .nojekyll лежит в public/ и попадает в корень выдачи: без него Pages не отдаёт папку _next.
      - name: Проверить выдачу
        run: test -f out/index.html && test -f out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
